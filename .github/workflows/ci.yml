name: PLC Skills Lab - Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to 26.04 on 2026-11-18 and Playwright's --with-deps install stalled there
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Offline engineering verification
        run: npm run verify:engineering:offline
      - name: TypeScript, Vitest and Vite production build
        run: npm run verify:full
      - name: Enforce compressed bundle transfer-size budgets
        run: node scripts/check-performance-budgets.cjs
      - name: Install headless Chrome for browser acceptance
        run: |
          npm install --no-save --no-audit --no-fund puppeteer@24.31.0 axe-core@4.10.3
          npx puppeteer browsers install chrome
      - name: Start local Vite preview for browser acceptance
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/plc-vite-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
      - name: R2 project library - multiple projects, restore after wipe, two-tab conflict, versions, confirmed delete, damaged record, no-IndexedDB
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r2-project-library-browser.cjs
      - name: Offline update protocol - a newer build waits, the page offers a reload, the project survives
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/offline-update-browser.cjs
      - name: R9 guided lessons - unwired starter, honest failure, UI build passes the outcome check, wrong build rejected, downloadable starters
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r9-lessons-browser.cjs
      - name: Steady Guide first lamp - real UI placement, 3 wires, OFF ON OFF, disconnected wire refusal and project isolation
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/steady-guide-first-lamp-browser.cjs
      - name: Steady Guide - read-only onboarding, 92 devices, 21 scenes, real screenshot, search and mobile
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/steady-guide-browser.cjs
      - name: Capture authentic Steady Guide review screenshots (not automatically published)
        env:
          STEADY_GUIDE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/steady-guide-capture-browser.cjs
      - name: Preserve Steady Guide raw screenshots for review (even if capture is incomplete)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steady-guide-raw-captures
          path: qa-artifacts/steady-guide-captures/
          if-no-files-found: warn
          retention-days: 14
      - name: Browser - wire colour and net label (R5.1)
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r5-wire-style-browser.cjs
      - name: R09/R23 scan period and simulation speed - same model-time behaviour at different periods and speeds, diagnostics, persistence
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-scan-time-browser.cjs
      - name: R10 factory scale - 250-component project loads, runs in the real worker and reports load
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-factory-scale-browser.cjs
      - name: R12 operator devices - selector switch, buzzer and siren built from an empty floor, fault consequence, reload
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-operator-devices-browser.cjs
      - name: Sandbox seven demonstration projects load and run browser acceptance
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-demos-browser.cjs
      - name: R02 custom shapes - drawn editor (views, add, remove, shape and turn), define, reject invalid, remove
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r02-shapes-browser.cjs
      - name: R21/R22 free rotation - turn a belt by 15 degree steps from the toolbar, back to its exact saved shape
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r22-free-rotation-browser.cjs
      - name: R07/R14 inspector - attach an expansion module, rename a channel, link a belt to a drive
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r07-inspector-browser.cjs
      - name: R4.1 Ladder editing - duplicate, copy/paste, move, undo/redo with buttons and Ctrl+Z / Ctrl+Y
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r4-ladder-edit-browser.cjs
      - name: R22 grouping - group, whole-group selection, rotate about the centre, ungroup, undo, reload
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r22-groups-browser.cjs
      - name: R12 live operator controls - hold START on the station and watch the process respond
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r12-operator-live-browser.cjs
      - name: R24 simulated operator - place, walk, blocked by the closed door, access request, walk in
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r24-operator-browser.cjs
      - name: R02/R16/R26 material flow - feeder quantity, collector counting, conservation, live status
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-material-flow-browser.cjs
      - name: R03 inclined belt - friction sorts cartons from glass bottles, incline set in the inspector
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-incline-browser.cjs
      - name: R04/R17 sensors - vision inspection and RFID tags read live on a running line
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-sensors-browser.cjs
      - name: R06 pneumatics - compressor, regulator and cylinder (pressure builds, stroke follows the regulator, low pressure blocks)
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-pneumatics-browser.cjs
      - name: R20 guard door - a closed interlocked door holds the line, the operator opens it, material flows
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r13-guard-door-browser.cjs
      - name: R1 contextual workbench - canvas share, no clipped controls at five sizes, explicit tools, shortcuts, preference recovery
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-r1-workbench-browser.cjs
      - name: Open sandbox P1 - place, wire, program, run and test failures
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-browser-acceptance.cjs
      - name: P1 advanced authoring - select, duplicate, undo, redo, rotate, copy, paste and reload
