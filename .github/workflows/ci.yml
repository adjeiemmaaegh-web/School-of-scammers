      - name: No-WebGL low-resource browser functionality
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/cpu-fallback-acceptance.cjs
      - name: Collect dependency, security and asset evidence (not legal clearance)
        if: always()
        shell: bash
        run: |
          mkdir -p qa-artifacts
          node scripts/asset-provenance.cjs > qa-artifacts/source-assets.json
          if test -f package-lock.json; then cp package-lock.json qa-artifacts/resolved-package-lock.json; fi
          if npm sbom --sbom-format cyclonedx > qa-artifacts/dependencies.cdx.json; then
            echo "SBOM produced from actual CI installed dependency tree" > qa-artifacts/sbom-status.txt
          else
            echo "SBOM generation failed - unresolved release blocker" > qa-artifacts/sbom-status.txt
          fi
          if npm audit --json > qa-artifacts/npm-audit.json; then
            echo "npm audit returned zero" > qa-artifacts/audit-status.txt
          else
            echo "npm audit returned nonzero - review findings, not legal signoff" > qa-artifacts/audit-status.txt
          fi
      - name: Upload dependency and source provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plc-release-provenance
          path: qa-artifacts/
          if-no-files-found: warn
      - name: Upload production build (if successful)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plc-skills-lab-dist
          path: dist/
          if-no-files-found: error
  firefox-webkit:
    # Firefox and Linux WebKit run in Microsoft's Playwright image, whose browsers and system libraries are preinstalled at the
    # same version as the pinned playwright package. The old in-job apt install stalled on a slow mirror, and its timeout
    # killed npx but left apt-get holding the dpkg lock, so every retry failed and the whole build job hit 40 minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Use the image's preinstalled Firefox and WebKit
        run: npm install --no-save --no-audit --no-fund playwright@1.64.1
      - name: Firefox and Linux WebKit browser smoke - DC, PLC workcell and mobile
        # One step: a background preview server is not guaranteed to outlive a step inside a container job.
        # HOME=/root: the job runs as root but GitHub mounts $HOME owned by pwuser, and Firefox refuses to start then.
        env:
          HOME: /root
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 > /tmp/plc-firefox-preview.log 2>&1 &
