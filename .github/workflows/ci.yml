      - name: P22 genuine full-lane occupancy, PLC feeder inhibit, post-clearance third original carton and source-negative
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-p22-real-zone-browser.cjs
      - name: P23 two-belt handoff, downstream I0.7 feeder inhibit, powered receiver and source-negative
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-p23-two-belt-handoff-browser.cjs
      - name: P24 original-body 200ms physical outfeed hold, powered PLC release and premature-release negative
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-p24-physical-outfeed-hold-browser.cjs
