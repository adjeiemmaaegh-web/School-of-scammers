      - name: P6 primary 3D workcell - Fly First Person and direct worker validated model dragging
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/run-browser-step.cjs scripts/sandbox-3d-workcell-browser.cjs
      - name: P7 3D factory commissioning - empty real 3D floor, PLC16 ST, 23 wires, worker parcel
