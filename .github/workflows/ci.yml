name: PLC Skills Lab - Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Offline engineering verification
        run: npm run verify:engineering:offline
      - name: TypeScript, Vitest and Vite production build
        run: npm run verify:full
      - name: Upload production build (if successful)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plc-skills-lab-dist
          path: dist/
          if-no-files-found: error
