name: PLC Skills Lab - Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Offline engineering verification
        run: npm run verify:engineering:offline
      - name: TypeScript, Vitest and Vite production build
        run: npm run verify:full
      - name: Enforce compressed bundle transfer-size budgets
        run: node scripts/check-performance-budgets.cjs
      - name: Install headless Chrome for browser acceptance
        run: |
          npm install --no-save --no-audit --no-fund puppeteer@24.31.0 axe-core@4.10.3
          npx puppeteer browsers install chrome
      - name: Start local Vite preview for browser acceptance
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/plc-vite-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
      - name: Open sandbox P1 - place, wire, program, run and test failures
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-browser-acceptance.cjs
      - name: UX-first workbench - workflow, device inspector and responsive design
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-ux-acceptance.cjs
      - name: Integrated numeric PLC and P5 workspace - real wiring/view browser E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p5-workspace-browser.cjs
      - name: P2 PLC programming - real multi-rung timers and Structured Text E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p2-browser-acceptance.cjs
      - name: P2 typed numeric PLC - INT, ADD and comparator 3D motor browser E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p2-numeric-browser.cjs
      - name: P3 integrated worker - genuine PLC to box feeder, photoeye and lamp browser E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p3-plant-browser.cjs
      - name: P3 3D sorting - powered conveyor, photoeye, diverter and wrong PLC logic
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p3-sorting-browser.cjs
      - name: P3 3D tank - wired pump, high-level switch and drain valve browser E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p3-tank-browser.cjs
      - name: Analog process I/O - numeric tank signal drives ST-controlled pump over isolated wire
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-analog-browser.cjs
      - name: P4 integrated star-delta - real 24V PLC/ST coils and isolated 400V source browser E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p4-star-delta-browser.cjs
      - name: P4 electrical panel - breaker, overload, pilot lamp and 24V multimeter browser E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p4-panel-browser.cjs
      - name: P4 3D reversing - physical dual NC interlocks and motor direction browser E2E
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p4-reversing-browser.cjs
      - name: P5 troubleshooting - hidden fault, symptom-only alarm, multimeter diagnosis and part replacement
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p5-faults-browser.cjs
      - name: P5 sensor troubleshooting - stuck photoeye lies to the PLC on the running sorting line
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p5-sensor-browser.cjs
      - name: Multi-PLC - two panels, per-PLC Ladder/ST programs, PLC-to-PLC signalling over a shared common
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p7-multiplc-browser.cjs
      - name: Relay and cylinder - hard-wired relay latch with no PLC, PLC-driven pneumatic cylinder with limit switches
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p13-relay-cylinder-browser.cjs
      - name: Cylinder faults and stack light - PLC-driven stack light, no-air and dead-limit-switch faults, repair clears the alarm
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p14-cylinder-faults-browser.cjs
      - name: On-delay relay and device settings - hard-wired timer, dial set in the inspector, TIMING then CONTACTS ON, reset on early release
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p15-timer-relay-browser.cjs
      - name: Configurable I/O - a 16/16 PLC with named tags in both banks, refused renames, persistence
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p12-configurable-io-browser.cjs
      - name: Authored plant - build a two-station plant from an empty floor through the UI, commission, troubleshoot, reload
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p11-authored-plant-browser.cjs
      - name: Per-instance plant - two conveyor lanes and two tanks, each with its own PLC, devices and counters
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p10-multiplant-browser.cjs
      - name: Product structure - simulator-first home, primary navigation, separate Learn and Assessments sections
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/simulator-first-browser.cjs
      - name: Edit plant - one-click panels, remove with cleanup, undo, first-PLC promotion, Delete key
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p8-edit-plant-browser.cjs
      - name: P6 scenarios - graded by outcome on the real sandbox, employer to candidate to review
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/sandbox-p6-scenario-browser.cjs
      - name: Browser smoke - routes, machine control, meter, assessment and mobile
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/browser-acceptance.cjs
      - name: Offline deep-link and lazy-lab cache acceptance
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/offline-acceptance.cjs
      - name: Automated WCAG accessibility and keyboard skip-navigation audit
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/accessibility-acceptance.cjs
      - name: No-WebGL low-resource browser functionality
        run: PLC_BASE_URL=http://127.0.0.1:4173 node scripts/cpu-fallback-acceptance.cjs
      - name: Install Firefox and Linux WebKit for browser acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps firefox webkit
      - name: Firefox browser smoke - DC, PLC workcell and mobile
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 > /tmp/plc-firefox-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4174/ > /dev/null
          PLC_BASE_URL=http://127.0.0.1:4174 node scripts/firefox-acceptance.cjs
      - name: Linux WebKit browser smoke - DC, workcell and mobile
        run: |
          PLC_BASE_URL=http://127.0.0.1:4174 node scripts/webkit-acceptance.cjs
      - name: Collect dependency, security and asset evidence (not legal clearance)
        if: always()
        shell: bash
        run: |
          mkdir -p qa-artifacts
          node scripts/asset-provenance.cjs > qa-artifacts/source-assets.json
          if test -f package-lock.json; then cp package-lock.json qa-artifacts/resolved-package-lock.json; fi
          if npm sbom --sbom-format cyclonedx > qa-artifacts/dependencies.cdx.json; then
            echo "SBOM produced from actual CI installed dependency tree" > qa-artifacts/sbom-status.txt
          else
            echo "SBOM generation failed - unresolved release blocker" > qa-artifacts/sbom-status.txt
          fi
          if npm audit --json > qa-artifacts/npm-audit.json; then
            echo "npm audit returned zero" > qa-artifacts/audit-status.txt
          else
            echo "npm audit returned nonzero - review findings, not legal signoff" > qa-artifacts/audit-status.txt
          fi
      - name: Upload dependency and source provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plc-release-provenance
          path: qa-artifacts/
          if-no-files-found: warn
      - name: Upload production build (if successful)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plc-skills-lab-dist
          path: dist/
          if-no-files-found: error
