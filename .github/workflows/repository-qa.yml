name: PLC Skills Lab - Repository QA and Security
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Inventory complete source and security surface
        run: node scripts/qa-static-inventory.cjs
      - name: Verify npm lockfile roots and detect high-confidence embedded credentials
        run: node scripts/qa-lockfile-credential-check.cjs
      - name: Unit adversarial assessment/trade/persistence boundaries
        run: npx vitest run tests/qa-trust-boundaries.test.ts
      - name: Additional standalone factory acceptance and scan-debugger verification
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" node qa/verify-fat.cjs
          PATH="$PWD/node_modules/.bin:$PATH" node qa/verify-scan-debugger.cjs
      - name: Audit production and complete npm dependency tree
        run: node scripts/qa-dependency-audit.cjs
      - name: Preserve QA security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plc-repository-qa-security
          path: |
            qa-artifacts/qa-static-inventory.json
            qa-artifacts/qa-lockfile-credential-check.json
            qa-artifacts/npm-audit-production.json
            qa-artifacts/npm-audit-complete.json
            qa-artifacts/qa-advisory-summary.json
          if-no-files-found: warn
  native-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Vitest 5.1-compatible V8 coverage provider outside the project lockfile
        # Installing --no-save into the root project repeatedly triggered npm Arborist
        # "Cannot read properties of null (reading 'edgesOut')" on Node 22.
        # Isolated install uses legacy-peer-deps to avoid npm 10's broken optional peer-set traversal.
        # Keep npm ci's installed production/test tree untouched; expose exactly
        # one compatible coverage provider through a symlink for actual coverage.
        run: |
          set -euo pipefail
          coverage_dir="$RUNNER_TEMP/plc-coverage-provider"
          npm install --prefix "$coverage_dir" --no-audit --no-fund --package-lock=false --legacy-peer-deps @vitest/coverage-v8@5.1.0
          test -f "$coverage_dir/node_modules/@vitest/coverage-v8/package.json"
          mkdir -p node_modules/@vitest
          ln -s "$coverage_dir/node_modules/@vitest/coverage-v8" node_modules/@vitest/coverage-v8
          # V8 provider's peer needs to resolve to the exact tested project Vitest,
          # not a duplicate in an isolated npm tree.
          if test ! -e "$coverage_dir/node_modules/vitest"; then
            ln -s "$GITHUB_WORKSPACE/node_modules/vitest" "$coverage_dir/node_modules/vitest"
          fi
      - name: Execute all repository native tests with V8 source coverage
        env:
          PLC_COVERAGE_RUN: '1'   # relaxes only the wall-clock real-time guards (factory-scale, r7-soak-benchmark)
        run: npx vitest run --coverage --coverage.all --coverage.reporter=json-summary --coverage.reporter=text-summary
      - name: Preserve full-source coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plc-repository-qa-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: warn
